<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Whole Donuts – Universal Entry</title>

<style>
    body {
        margin: 0;
        padding: 0;
        background: #fafafa;
        font-family: Arial, sans-serif;
        text-align: center;
        color: #222;
    }
    .container {
        max-width: 900px;
        margin: 0 auto;
        padding: 40px 20px;
    }
    h1 {
        font-size: 2.4rem;
        margin-bottom: 20px;
    }
    .grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 20px;
        margin: 30px 0;
    }
    .stick {
        background: white;
        padding: 20px;
        border-radius: 12px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        cursor: pointer;
        transition: 0.2s;
    }
    .stick:hover {
        transform: scale(1.05);
    }
    button {
        padding: 14px 20px;
        font-size: 1.2rem;
        background: black;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        margin-top: 20px;
    }
</style>

</head>
<body>
<div class="container">

    <h1>Welcome to the Whole Donuts Universe</h1>
    <p>Select the stick figure that best represents you.</p>

    <!-- 4 CORE IDENTITY FIGURES -->
    <div class="grid">
        <div class="stick" onclick="selectIdentity('adult')">Adult Man</div>
        <div class="stick" onclick="selectIdentity('adult')">Adult Woman</div>
        <div class="stick" onclick="selectIdentity('youth')">Youth Boy</div>
        <div class="stick" onclick="selectIdentity('youth')">Youth Girl</div>
    </div>

    <div id="step2" style="display:none;">
        <h2>How do you feel right now?</h2>
        <div class="grid">
            <!-- 14 PRESENT EMOTION FIGURES -->
            <div class="stick" onclick="presentEmotion()">🙂</div>
            <div class="stick" onclick="presentEmotion()">😐</div>
            <div class="stick" onclick="presentEmotion()">😢</div>
            <div class="stick" onclick="presentEmotion()">😡</div>
            <div class="stick" onclick="presentEmotion()">😨</div>
            <div class="stick" onclick="presentEmotion()">😴</div>
            <div class="stick" onclick="presentEmotion()">🤒</div>
            <div class="stick" onclick="presentEmotion()">🤕</div>
            <div class="stick" onclick="presentEmotion()">🤯</div>
            <div class="stick" onclick="presentEmotion()">🤬</div>
            <div class="stick" onclick="presentEmotion()">🤢</div>
            <div class="stick" onclick="presentEmotion()">😎</div>
            <div class="stick" onclick="presentEmotion()">🤗</div>
            <div class="stick" onclick="presentEmotion()">🥺</div>
        </div>
    </div>

    <div id="step3" style="display:none;">
        <h2>How do you hope to feel?</h2>
        <div class="grid">
            <!-- 7 HOPE EMOTION FIGURES -->
            <div class="stick" onclick="hopeEmotion()">😀</div>
            <div class="stick" onclick="hopeEmotion()">😊</div>
            <div class="stick" onclick="hopeEmotion()">😌</div>
            <div class="stick" onclick="hopeEmotion()">🤩</div>
            <div class="stick" onclick="hopeEmotion()">🥰</div>
            <div class="stick" onclick="hopeEmotion()">😇</div>
            <div class="stick" onclick="hopeEmotion()">🤗</div>
        </div>
    </div>

    <div id="step4" style="display:none;">
        <h2>Your High School Graduation Year</h2>
        <input id="gradyear" type="number" placeholder="YYYY" style="padding:12px;font-size:1.2rem;width:200px;">
        <button onclick="route()">Continue</button>
    </div>

</div>

<script>
let identity = null;

function selectIdentity(type) {
    identity = type;
    document.getElementById("step2").style.display = "block";
}

function presentEmotion() {
    document.getElementById("step3").style.display = "block";
}

function hopeEmotion() {
    document.getElementById("step4").style.display = "block";
}

function route() {
    const year = parseInt(document.getElementById("gradyear").value);

    if (!year) {
        alert("Please enter your graduation year.");
        return;
    }

    // Youth protection lock
    if (identity === 'youth' || year > 2026) {
        window.location.href = "/TABLE/index.html";
    } else {
        window.location.href = "/COUNTER/index.html";
    }
}
</script>

</body>
</html>
