name: Deploy Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out the reviewed revision
        uses: actions/checkout@v4

      - name: Use the supported JavaScript runtime
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate the public experience
        run: |
          node --check app.js
          node --check world/script.js
          node --test tests/public-site.test.js

      - name: Build the reviewed public bundle
        shell: bash
        run: |
          set -euo pipefail

          test "$(tr -d '\r\n' < CNAME)" = "wenevergonnaclose.com"
          test "$(wc -l < CNAME)" -eq 1
          grep -Fq 'https://wenevergonnaclose.com/' index.html
          grep -Fq 'https://wenevergonnaclose.com/sitemap.xml' robots.txt

          mkdir -p _site/templates _site/world
          cp CNAME _site/
          cp index.html guide.html styles.css app.js review-queue-manifest.js robots.txt sitemap.xml _site/
          cp CRUMB_PROTOCOL.md PUBLIC_SYSTEM.md RELEASE_NOTES.md WHOLE_DONUTS_GUIDE.md _site/
          cp templates/plus-u-build-your-table-template.md \
             templates/plus-u-next-step-template.md \
             templates/plus-u-share-a-crumb-template.md \
             _site/templates/
          cp world/index.html world/script.js world/styles.css _site/world/

          test "$(tr -d '\r\n' < _site/CNAME)" = "wenevergonnaclose.com"

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
