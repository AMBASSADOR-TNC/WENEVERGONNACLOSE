name: WD Validate Intake

on:
  workflow_dispatch:
  push:
    paths:
      - "wd-system/**"
      - ".github/workflows/wd-validate-intake.yml"

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show WD file locations
        run: |
          echo "=== REPOSITORY ROOT ==="
          pwd

          echo "=== WD FILES ==="
          find . -maxdepth 4 -type f | sort

      - name: Confirm required files exist
        run: |
          test -f wd-system/wd_input.py
          test -f wd-system/wd_monitor.py
          test -f wd-system/wd-config.json

          echo "ALL REQUIRED WD FILES FOUND"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate WD.INPUT Python
        run: |
          python -m py_compile wd-system/wd_input.py
          echo "WD.INPUT PYTHON VALID"

      - name: Validate 72-hour monitor Python
        run: |
          python -m py_compile wd-system/wd_monitor.py
          echo "WD MONITOR PYTHON VALID"

      - name: Validate WD configuration
        run: |
          python -m json.tool wd-system/wd-config.json > /dev/null
          echo "WD CONFIGURATION VALID"

      - name: WD release validation
        run: |
          echo "================================"
          echo "WD VALIDATION PASSED"
          echo "================================"
          echo "WD.INPUT code: PASS"
          echo "72-hour monitor: PASS"
          echo "Configuration: PASS"
          echo "Next gate: controlled WD.INPUT"
